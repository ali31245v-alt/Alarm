name: Build Smart Alarm APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name smart_alarm build_app
      - name: Copy app source and configure Android
        run: |
          cp app_src/pubspec.yaml build_app/pubspec.yaml
          cp app_src/lib/main.dart build_app/lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <application/' build_app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build_app/android/app/build.gradle.kts")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s, n = re.subn(r"compileOptions\s*\{", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", s, count=1)
              if n == 0:
                  raise SystemExit("Could not find compileOptions block in generated Android Gradle file")
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dep not in s:
              if re.search(r"(?m)^dependencies\\s*\\{", s):
                  s = re.sub(r"(?m)^dependencies\\s*\\{", "dependencies {\n    " + dep, s, count=1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
          p.write_text(s)
          print("Configured Android core library desugaring.")
          PY
      - name: Add native looping alarm ringtone
        run: |
          cat > build_app/android/app/src/main/kotlin/com/example/smart_alarm/MainActivity.kt <<'KOTLIN'
          package com.example.smart_alarm

          import android.media.AudioAttributes
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var alarmRingtone: Ringtone? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "smart_alarm/ringtone")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  try {
                                      if (alarmRingtone?.isPlaying != true) {
                                          val uri: Uri = Settings.System.DEFAULT_ALARM_ALERT_URI
                                              ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                                              ?: Settings.System.DEFAULT_NOTIFICATION_URI
                                          alarmRingtone = RingtoneManager.getRingtone(applicationContext, uri)
                                          alarmRingtone?.audioAttributes = AudioAttributes.Builder()
                                              .setUsage(AudioAttributes.USAGE_ALARM)
                                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                              .build()
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                              alarmRingtone?.isLooping = true
                                          }
                                          alarmRingtone?.play()
                                      }
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.error("RINGTONE_ERROR", e.message, null)
                                  }
                              }
                              "stop" -> {
                                  alarmRingtone?.stop()
                                  alarmRingtone = null
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onDestroy() {
                  alarmRingtone?.stop()
                  alarmRingtone = null
                  super.onDestroy()
              }
          }
          KOTLIN
      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get
      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-alarm-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
